<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    /* Mengatur agar halaman memenuhi tinggi layar */
    .vh-100 {
      min-height: 100vh;
    }
    
    /* Mengatur gambar background di sisi kiri */
    .bg-image {
      background-image: url('https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=1000&fit=crop&q=80');
      background-size: cover;
      background-position: center;
    }

    /* Mempercantik tombol agar tidak terlalu kaku */
    .btn-primary {
      padding: 0.75rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
    <div class="container-fluid">
    <div class="row vh-100">
      
      <div class="col-md-6 col-lg-7 d-none d-md-block bg-image"></div>
      
      <div class="col-md-6 col-lg-5 d-flex align-items-center justify-content-center bg-white">
        <div class="w-100 px-4 px-md-5" style="max-width: 500px;">
          
          <div class="text-center mb-5">
            <a href="index.html" class="text-decoration-none text-dark">
              <h2 class="fw-bold">Vesakha Properti</h2>
            </a>
            <p class="text-muted">Selamat datang kembali! Silakan masuk ke akun Anda.</p>
          </div>

          <form>
            <div class="form-floating mb-3">
              <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com" >
              <label for="floatingInput">Alamat Email</label>
            </div>
            
            <div class="form-floating mb-3">
              <input type="password" class="form-control" id="floatingPassword" placeholder="Password" >
              <label for="floatingPassword">Kata Sandi</label>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                <label class="form-check-label text-muted" for="rememberMe">
                  Ingat Saya
                </label>
              </div>
              <a href="#" class="text-primary text-decoration-none small">Lupa Kata Sandi?</a>
            </div>

            <a href="dashboard.html" class="btn btn-primary w-100 mb-4">Masuk</a>

            <div class="text-center">
              <p class="text-muted small">Belum punya akun? <a href="#" class="text-primary fw-bold text-decoration-none">Daftar Sekarang</a></p>
            </div>
          </form>

        </div>
      </div>

    </div>
  </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
